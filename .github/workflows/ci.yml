name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify application and database
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: caleida_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d caleida_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@localhost:5432/caleida_ci
      CALEIDA_DB_TARGET: ephemeral

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Verify runtime contract
        shell: bash
        run: |
          test "$(node --version)" = "v24.20.0"
          test "$(npm --version)" = "11.19.0"

      - name: Install dependencies
        run: npm ci

      - name: Verify application
        run: npm run verify

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Verify PostgreSQL server
        shell: bash
        run: |
          test "$(psql "$DATABASE_URL_UNPOOLED" -Atqc "SHOW server_version_num" | cut -c1-2)" = "18"

      - name: Verify database
        run: npm run verify:db
