# Live probe for US-PRIV-001
name: US-PRIV-001 live probe

on:
  push:
    branches:
      - probe/us-priv-001-live

permissions:
  contents: read

concurrency:
  group: us-priv-001-live-probe
  cancel-in-progress: true

jobs:
  live-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: patient-glade-95136440
      NEON_BRANCH_ID: br-silent-rain-aw4fqrhg
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Validate probe syntax
        shell: bash
        run: node --check tests/live-us-priv-001-probe.mjs

      - name: Prepare isolated Neon fixtures
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${NEON_API_KEY:-}" ]; then
            echo 'CALEIDA_NEON_API_KEY_AVAILABLE false'
            exit 42
          fi

          echo "::add-mask::${NEON_API_KEY}"
          echo 'CALEIDA_NEON_API_KEY_AVAILABLE true'
          npm install --global neon@latest >/dev/null
          neon --version

          auth_json="$(neon neon-auth status --project-id "$NEON_PROJECT_ID" --branch "$NEON_BRANCH_ID" --output json --no-color)"
          data_json="$(neon data-api get --project-id "$NEON_PROJECT_ID" --branch "$NEON_BRANCH_ID" --database neondb --output json --no-color)"

          auth_url="$(printf '%s' "$auth_json" | jq -r '[.. | strings | select(test("^https://.*\\.neonauth\\..*/auth$"))][0] // empty')"
          data_url="$(printf '%s' "$data_json" | jq -r '[.. | strings | select(test("^https://.*\\.apirest\\..*/rest/v1$"))][0] // empty')"
          test -n "$auth_url"
          test -n "$data_url"
          echo "::add-mask::${auth_url}"
          echo "::add-mask::${data_url}"
          echo "NEON_AUTH_BASE_URL=${auth_url}" >> "$GITHUB_ENV"
          echo "NEON_DATA_API_URL=${data_url}" >> "$GITHUB_ENV"
          echo 'CALEIDA_BRANCH_ENDPOINTS_DISCOVERED true'

          suffix="${GITHUB_RUN_ID}-$(openssl rand -hex 5)"
          email_a="caleida-uspriv001-a-${suffix}@grabmail.io"
          email_b="caleida-uspriv001-b-${suffix}@grabmail.io"
          echo "::add-mask::${email_a}"
          echo "::add-mask::${email_b}"
          echo "CALEIDA_PROFILE_EMAIL_A=${email_a}" >> "$GITHUB_ENV"
          echo "CALEIDA_PROFILE_EMAIL_B=${email_b}" >> "$GITHUB_ENV"

          neon neon-auth user create --email "$email_a" --name 'Caleida US PRIV 001 A' --project-id "$NEON_PROJECT_ID" --branch "$NEON_BRANCH_ID" --output json --no-color >/dev/null
          user_a="$(NEONCTL_PSQL_FALLBACK=1 neon psql "$NEON_BRANCH_ID" --project-id "$NEON_PROJECT_ID" --database-name neondb -- -At -v ON_ERROR_STOP=1 -c "SELECT id FROM neon_auth.\"user\" WHERE email = '${email_a}' LIMIT 1;" 2>/dev/null | grep -Eo '[0-9a-fA-F-]{36}' | tail -n 1)"
          test -n "$user_a"
          echo "::add-mask::${user_a}"
          echo "CALEIDA_PROFILE_USER_A=${user_a}" >> "$GITHUB_ENV"

          neon neon-auth user create --email "$email_b" --name 'Caleida US PRIV 001 B' --project-id "$NEON_PROJECT_ID" --branch "$NEON_BRANCH_ID" --output json --no-color >/dev/null
          user_b="$(NEONCTL_PSQL_FALLBACK=1 neon psql "$NEON_BRANCH_ID" --project-id "$NEON_PROJECT_ID" --database-name neondb -- -At -v ON_ERROR_STOP=1 -c "SELECT id FROM neon_auth.\"user\" WHERE email = '${email_b}' LIMIT 1;" 2>/dev/null | grep -Eo '[0-9a-fA-F-]{36}' | tail -n 1)"
          test -n "$user_b"
          echo "::add-mask::${user_b}"
          echo "CALEIDA_PROFILE_USER_B=${user_b}" >> "$GITHUB_ENV"
          echo 'CALEIDA_SYNTHETIC_AUTH_USERS_READY true'

      - name: Execute JWT, Data API and RLS matrix
        shell: bash
        run: |
          set -euo pipefail
          node tests/live-us-priv-001-probe.mjs

      - name: Cleanup synthetic fixtures
        if: always()
        shell: bash
        run: |
          set +e
          if [ -z "${NEON_API_KEY:-}" ]; then
            echo 'CALEIDA_SYNTHETIC_CLEANUP_SKIPPED no_api_key'
            exit 0
          fi

          npm install --global neon@latest >/dev/null 2>&1

          resolve_user_id_by_email() {
            local email="$1"
            if [ -z "$email" ]; then
              return 0
            fi
            NEONCTL_PSQL_FALLBACK=1 neon psql "$NEON_BRANCH_ID" \
              --project-id "$NEON_PROJECT_ID" \
              --database-name neondb \
              -- -At -v ON_ERROR_STOP=1 -c "SELECT id FROM neon_auth.\"user\" WHERE email = '${email}' LIMIT 1;" 2>/dev/null \
              | grep -Eo '[0-9a-fA-F-]{36}' | tail -n 1
          }

          user_a="${CALEIDA_PROFILE_USER_A:-}"
          user_b="${CALEIDA_PROFILE_USER_B:-}"

          if [[ ! "$user_a" =~ ^[0-9a-fA-F-]{36}$ ]] && [ -n "${CALEIDA_PROFILE_EMAIL_A:-}" ]; then
            user_a="$(resolve_user_id_by_email "$CALEIDA_PROFILE_EMAIL_A")"
          fi
          if [[ ! "$user_b" =~ ^[0-9a-fA-F-]{36}$ ]] && [ -n "${CALEIDA_PROFILE_EMAIL_B:-}" ]; then
            user_b="$(resolve_user_id_by_email "$CALEIDA_PROFILE_EMAIL_B")"
          fi

          ids=()
          if [[ "$user_a" =~ ^[0-9a-fA-F-]{36}$ ]]; then
            ids+=("$user_a")
          fi
          if [[ "$user_b" =~ ^[0-9a-fA-F-]{36}$ ]]; then
            ids+=("$user_b")
          fi

          if [ "${#ids[@]}" -gt 0 ]; then
            quoted=""
            for id in "${ids[@]}"; do
              if [ -n "$quoted" ]; then quoted+=","; fi
              quoted+="'${id}'::uuid"
            done
            NEONCTL_PSQL_FALLBACK=1 neon psql "$NEON_BRANCH_ID" \
              --project-id "$NEON_PROJECT_ID" \
              --database-name neondb \
              -- -v ON_ERROR_STOP=1 -c "DELETE FROM caleida_profile.profiles WHERE auth_user_id IN (${quoted});" >/dev/null 2>&1
          fi

          if [[ "$user_a" =~ ^[0-9a-fA-F-]{36}$ ]]; then
            neon neon-auth user delete "$user_a" --project-id "$NEON_PROJECT_ID" --branch "$NEON_BRANCH_ID" --output json --no-color >/dev/null 2>&1
          fi
          if [[ "$user_b" =~ ^[0-9a-fA-F-]{36}$ ]]; then
            neon neon-auth user delete "$user_b" --project-id "$NEON_PROJECT_ID" --branch "$NEON_BRANCH_ID" --output json --no-color >/dev/null 2>&1
          fi

          echo 'CALEIDA_SYNTHETIC_CLEANUP_ATTEMPTED true'
