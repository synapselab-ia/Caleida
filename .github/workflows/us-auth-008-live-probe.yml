name: US-AUTH-008 live matrix probe

on:
  push:
    branches:
      - probe/us-auth-008-live

permissions:
  contents: read

concurrency:
  group: us-auth-008-live-probe
  cancel-in-progress: true

jobs:
  live-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Verify anonymous private boundary in real Chrome
        shell: bash
        env:
          PREVIEW_ORIGIN: https://caleida-git-feat-us-auth-008-6f2292-synapselabia-8285s-projects.vercel.app
        run: |
          set -euo pipefail
          google-chrome --version
          google-chrome --headless --no-sandbox --disable-gpu --dump-dom "${PREVIEW_ORIGIN}/app" > /tmp/app-anon.html 2>/tmp/chrome.err
          grep -q 'Entre no Caleida' /tmp/app-anon.html
          if grep -q 'Área privada' /tmp/app-anon.html; then
            echo 'Private content leaked to anonymous Chrome session.' >&2
            exit 1
          fi
          echo 'CALEIDA_CHROME_ANON_NO_PRIVATE_FLASH true'
      - name: Execute integrated Auth matrix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/live-us-auth-008-probe.mjs')
          s = p.read_text()
          old = """const anonPrivateLeak = anonApp.text.includes('Área privada') || anonApp.text.includes('Sua sessão está protegida no servidor.');
          console.log('CALEIDA_ANON_APP_STATUS', anonApp.response.status);
          console.log('CALEIDA_ANON_PRIVATE_LEAK', anonPrivateLeak);
          assert.equal(anonPrivateLeak, false, 'anonymous response leaked private content');
          assert.ok([200, 301, 302, 303, 307, 308].includes(anonApp.response.status), 'unexpected anonymous /app response');
          """
          new = """const anonPrivateLeak = anonApp.text.includes('Área privada') || anonApp.text.includes('Sua sessão está protegida no servidor.');
          const anonIsRedirect = [301, 302, 303, 307, 308].includes(anonApp.response.status);
          console.log('CALEIDA_ANON_APP_STATUS', anonApp.response.status);
          console.log('CALEIDA_ANON_PRIVATE_LEAK_IN_REDIRECT_BODY', anonPrivateLeak);
          if (anonIsRedirect) {
            const location = anonApp.response.headers.get('location') ?? '';
            assert.ok(location.includes('/login'), `anonymous /app redirected somewhere unexpected: ${location}`);
          } else {
            assert.equal(anonApp.response.status, 200, 'unexpected anonymous /app response');
            assert.equal(anonPrivateLeak, false, 'anonymous 200 response leaked private content');
          }
          """
          if old not in s:
              raise SystemExit('probe patch target not found')
          s = s.replace(old, new)
          marker = "console.log('CALEIDA_LIVE_EMAIL', mailbox.email);"
          if marker not in s:
              raise SystemExit('email annotation patch target not found')
          s = s.replace(marker, marker + "\nconsole.log(`::notice title=CALEIDA_LIVE_EMAIL::${mailbox.email}`);")
          p.write_text(s)
          PY
          node --check tests/live-us-auth-008-probe.mjs
          node tests/live-us-auth-008-probe.mjs
