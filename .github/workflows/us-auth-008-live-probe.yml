name: US-AUTH-008 live matrix probe

on:
  push:
    branches:
      - probe/us-auth-008-live

permissions:
  contents: read

concurrency:
  group: us-auth-008-live-probe
  cancel-in-progress: true

jobs:
  live-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Verify anonymous private boundary in real Chrome
        shell: bash
        env:
          PREVIEW_ORIGIN: https://caleida-git-feat-us-auth-008-6f2292-synapselabia-8285s-projects.vercel.app
        run: |
          set -euo pipefail
          google-chrome --version
          google-chrome --headless --no-sandbox --disable-gpu --dump-dom "${PREVIEW_ORIGIN}/app" > /tmp/app-anon.html 2>/tmp/chrome.err
          grep -q 'Entre no Caleida' /tmp/app-anon.html
          if grep -q 'Área privada' /tmp/app-anon.html; then
            echo 'Private content leaked to anonymous Chrome session.' >&2
            exit 1
          fi
          echo 'CALEIDA_CHROME_ANON_NO_PRIVATE_FLASH true'
      - name: Prepare synthetic mailbox
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { randomBytes } from 'node:crypto';
          import { writeFile } from 'node:fs/promises';
          const email = `caleida-usauth008-${randomBytes(7).toString('hex')}@grabmail.io`;
          const probe = new URL('https://grabmail.io/api/v1/mailbox');
          probe.searchParams.set('address', email);
          const mailboxRes = await fetch(probe);
          assert.equal(mailboxRes.status, 200);
          await writeFile('.tmp-mailbox.json', JSON.stringify({ email, provider: 'grabmail' }), { mode: 0o600 });
          await writeFile('.tmp-email.txt', `${email}\n`);
          console.log('CALEIDA_MAILBOX_PREPARED true');
          NODE
      - name: Publish synthetic email coordination artifact
        uses: actions/upload-artifact@v4
        with:
          name: us-auth-008-live-email
          path: .tmp-email.txt
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: true
      - name: Execute integrated Auth matrix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('tests/live-us-auth-008-probe.mjs')
          s = p.read_text()
          old = """const anonPrivateLeak = anonApp.text.includes('Área privada') || anonApp.text.includes('Sua sessão está protegida no servidor.');
          console.log('CALEIDA_ANON_APP_STATUS', anonApp.response.status);
          console.log('CALEIDA_ANON_PRIVATE_LEAK', anonPrivateLeak);
          assert.equal(anonPrivateLeak, false, 'anonymous response leaked private content');
          assert.ok([200, 301, 302, 303, 307, 308].includes(anonApp.response.status), 'unexpected anonymous /app response');
          """
          new = """const anonPrivateLeak = anonApp.text.includes('Área privada') || anonApp.text.includes('Sua sessão está protegida no servidor.');
          const anonIsRedirect = [301, 302, 303, 307, 308].includes(anonApp.response.status);
          console.log('CALEIDA_ANON_APP_STATUS', anonApp.response.status);
          console.log('CALEIDA_ANON_PRIVATE_LEAK_IN_REDIRECT_BODY', anonPrivateLeak);
          if (anonIsRedirect) {
            const location = anonApp.response.headers.get('location') ?? '';
            assert.ok(location.includes('/login'), `anonymous /app redirected somewhere unexpected: ${location}`);
          } else {
            assert.equal(anonApp.response.status, 200, 'unexpected anonymous /app response');
            assert.equal(anonPrivateLeak, false, 'anonymous 200 response leaked private content');
          }
          """
          if old not in s:
              raise SystemExit('probe redirect patch target not found')
          s = s.replace(old, new)
          mailbox_old = "const mailbox = await createMailbox();"
          mailbox_new = "const mailbox = JSON.parse(await (await import('node:fs/promises')).readFile('.tmp-mailbox.json', 'utf8'));"
          if mailbox_old not in s:
              raise SystemExit('probe mailbox patch target not found')
          s = s.replace(mailbox_old, mailbox_new)
          grabmail = """async function mailboxMessages(mailbox) {
            const url = new URL('https://grabmail.io/api/v1/mailbox');
            url.searchParams.set('address', mailbox.email);
            url.searchParams.set('limit', '50');
            const res = await fetch(url, { signal: AbortSignal.timeout(15_000) });
            if (!res.ok) return [];
            const data = await res.json();
            return data?.messages ?? [];
          }

          async function mailboxMessage(mailbox, id) {
            await sleep(1_100);
            const url = new URL(`https://grabmail.io/api/v1/message/${encodeURIComponent(id)}`);
            url.searchParams.set('mailbox', mailbox.email);
            const res = await fetch(url, { signal: AbortSignal.timeout(15_000) });
            if (!res.ok) return null;
            const data = await res.json();
            return { ...data, html: data.html ? [data.html] : [] };
          }

          async function waitForOtp"""
          s, count = re.subn(r"async function mailboxMessages\(mailbox\) \{[\s\S]*?async function waitForOtp", grabmail, s, count=1)
          if count != 1:
              raise SystemExit('probe mailbox adapter patch target not found')
          session_old = """securityA = await page(a, '/account/security');
          const bForm = findForm(securityA.text, 'Caleida-Probe-B-UA');
          const revokeBData = formDataFromHtml(bForm);"""
          session_new = """securityA = await page(a, '/account/security');
          const bSessionResult = await jsonRequest(b, '/api/auth/get-session');
          const bSessionId = bSessionResult.data?.session?.id;
          assert.ok(bSessionId, 'session B id unavailable');
          const bForm = [...securityA.text.matchAll(/<form\\b[\\s\\S]*?<\\/form>/gi)]
            .map((match) => match[0])
            .find((form) => formDataFromHtml(form).get('sessionId') === bSessionId);
          assert.ok(bForm, 'session B revoke form not found by session id');
          const revokeBData = formDataFromHtml(bForm);"""
          if session_old not in s:
              raise SystemExit('probe session B patch target not found')
          s = s.replace(session_old, session_new)
          if "'Encerrar outras sessões'" not in s:
              raise SystemExit('probe revoke-other marker patch target not found')
          s = s.replace("'Encerrar outras sessões'", "'Encerrar todas as outras sessões'", 1)
          if 'attempt < 24' not in s or 'attempt < 30' not in s:
              raise SystemExit('probe email polling patch target not found')
          s = s.replace('attempt < 24', 'attempt < 90', 1)
          s = s.replace('attempt < 30', 'attempt < 90', 1)
          p.write_text(s)
          PY
          node --check tests/live-us-auth-008-probe.mjs
          node tests/live-us-auth-008-probe.mjs

