name: US-PRIV-005 Neon verification

on:
  push:
    branches:
      - probe/us-priv-005-neon
    paths:
      - .github/workflows/us-priv-005-neon-verify.yml
      - database/migrations/000014_account_lifecycle.sql
      - tests/account-lifecycle-contract.test.mjs
      - src/lib/account/**
      - src/lib/auth/session-management.ts

permissions:
  contents: read

concurrency:
  group: us-priv-005-neon-verify
  cancel-in-progress: true

jobs:
  verify-neon:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: patient-glade-95136440
      NEON_BASELINE_BRANCH_ID: br-restless-cherry-awpcwy6r
      MIGRATION_CHECKSUM: c532f794f7fe4ad28c2bf854a3a239f3d2ae1f140e7576bff7e2cb523802ce8d

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify Neon credential availability
        shell: bash
        run: |
          set -euo pipefail
          test -n "${NEON_API_KEY:-}"
          echo "::add-mask::${NEON_API_KEY}"
          echo 'CALEIDA_NEON_API_KEY_AVAILABLE true'

      - name: Install PostgreSQL client and Neon CLI
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install --yes postgresql-client jq >/dev/null
          npm install --global neon@latest >/dev/null
          neon --version
          psql --version

      - name: Create isolated Neon branch without custom compute settings
        shell: bash
        run: |
          set -euo pipefail
          BRANCH_NAME="verify-us-priv-005-${GITHUB_RUN_ID}"
          branch_json="$(neon branches create             --project-id "${NEON_PROJECT_ID}"             --parent "${NEON_BASELINE_BRANCH_ID}"             --name "${BRANCH_NAME}"             --output json             --no-color)"
          printf '%s' "${branch_json}" >/tmp/neon-branch.json

          VERIFY_BRANCH_ID="$(jq -r '.branch.id // .id // empty' /tmp/neon-branch.json)"
          test -n "${VERIFY_BRANCH_ID}"
          echo "VERIFY_BRANCH_ID=${VERIFY_BRANCH_ID}" >> "${GITHUB_ENV}"
          echo "CALEIDA_NEON_BRANCH_ID ${VERIFY_BRANCH_ID}"
          echo 'CALEIDA_NEON_BRANCH_CREATED true'

      - name: Confirm isolated Auth and Data API services
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERIFY_BRANCH_ID}"

          auth_json="$(neon neon-auth status             --project-id "${NEON_PROJECT_ID}"             --branch "${VERIFY_BRANCH_ID}"             --output json             --no-color)"
          data_json="$(neon data-api get             --project-id "${NEON_PROJECT_ID}"             --branch "${VERIFY_BRANCH_ID}"             --database neondb             --output json             --no-color)"

          test -n "${auth_json}"
          jq -e '.status == "active"' <<<"${data_json}" >/dev/null
          jq -e '.settings.db_schemas == ["caleida_profile"]' <<<"${data_json}" >/dev/null
          jq -e '.settings.db_anon_role == "anonymous"' <<<"${data_json}" >/dev/null
          jq -e '.settings.openapi_mode == "disabled"' <<<"${data_json}" >/dev/null

          echo 'CALEIDA_NEON_AUTH_STATUS_VERIFIED true'
          echo 'CALEIDA_DATA_API_SCOPE_VERIFIED true'

      - name: Apply 000014 on isolated branch
        shell: bash
        run: |
          set -euo pipefail
          NEONCTL_PSQL_FALLBACK=1 neon psql "${VERIFY_BRANCH_ID}"             --project-id "${NEON_PROJECT_ID}"             --database-name neondb             --role-name neondb_owner             -- -v ON_ERROR_STOP=1 -f database/migrations/000014_account_lifecycle.sql

          NEONCTL_PSQL_FALLBACK=1 neon psql "${VERIFY_BRANCH_ID}"             --project-id "${NEON_PROJECT_ID}"             --database-name neondb             --role-name neondb_owner             -- -v ON_ERROR_STOP=1 -c "INSERT INTO caleida_internal.schema_migrations (filename, checksum) VALUES ('000014_account_lifecycle.sql', '${MIGRATION_CHECKSUM}');"

          echo 'CALEIDA_000014_APPLIED true'

      - name: Verify managed roles and ACL readback
        shell: bash
        run: |
          set -euo pipefail

          query() {
            NEONCTL_PSQL_FALLBACK=1 neon psql "${VERIFY_BRANCH_ID}"               --project-id "${NEON_PROJECT_ID}"               --database-name neondb               --role-name neondb_owner               -- -qAt -v ON_ERROR_STOP=1 -c "$1"
          }

          roles="$(query "SELECT string_agg(rolname, ',' ORDER BY rolname) FROM pg_roles WHERE rolname IN ('anonymous','authenticated');")"
          test "${roles}" = "anonymous,authenticated"

          ledger="$(query "SELECT filename || ':' || checksum FROM caleida_internal.schema_migrations WHERE filename='000014_account_lifecycle.sql';")"
          test "${ledger}" = "000014_account_lifecycle.sql:${MIGRATION_CHECKSUM}"

          rls="$(query "SELECT relrowsecurity::text || '|' || relforcerowsecurity::text FROM pg_class WHERE oid='caleida_account.account_lifecycle'::regclass;")"
          test "${rls}" = "true|false"

          helper="$(query "SELECT prosecdef::text || '|' || has_function_privilege('authenticated','caleida_account.is_account_active(uuid)','EXECUTE')::text || '|' || has_function_privilege('anonymous','caleida_account.is_account_active(uuid)','EXECUTE')::text || '|' || has_function_privilege('public','caleida_account.is_account_active(uuid)','EXECUTE')::text FROM pg_proc WHERE oid='caleida_account.is_account_active(uuid)'::regprocedure;")"
          test "${helper}" = "true|true|true|false"

          lifecycle_grants="$(query "SELECT count(*) FROM information_schema.role_table_grants WHERE table_schema='caleida_account' AND table_name='account_lifecycle' AND grantee IN ('authenticated','anonymous');")"
          test "${lifecycle_grants}" = "0"

          audit_grants="$(query "SELECT count(*) FROM information_schema.role_table_grants WHERE table_schema='caleida_audit' AND table_name='account_lifecycle_events' AND grantee IN ('authenticated','anonymous');")"
          test "${audit_grants}" = "0"

          profile_guards="$(query "SELECT count(*) FROM pg_policies WHERE schemaname='caleida_profile' AND tablename='profiles' AND policyname LIKE 'profiles_account_lifecycle_%' AND permissive='RESTRICTIVE';")"
          test "${profile_guards}" = "3"

          block_guards="$(query "SELECT count(*) FROM pg_policies WHERE schemaname='caleida_profile' AND tablename='profile_blocks' AND policyname LIKE 'profile_blocks_account_lifecycle_%' AND permissive='RESTRICTIVE';")"
          test "${block_guards}" = "3"

          echo 'CALEIDA_MANAGED_ROLES_VERIFIED true'
          echo 'CALEIDA_LIFECYCLE_ACL_VERIFIED true'

      - name: Execute managed-role lifecycle matrix
        shell: bash
        run: |
          set -euo pipefail

          A='00000000-0000-4000-8000-000000000371'
          B='00000000-0000-4000-8000-000000000372'
          C='00000000-0000-4000-8000-000000000373'

          query() {
            NEONCTL_PSQL_FALLBACK=1 neon psql "${VERIFY_BRANCH_ID}"               --project-id "${NEON_PROJECT_ID}"               --database-name neondb               --role-name neondb_owner               -- -qAt -v ON_ERROR_STOP=1 -c "$1"
          }

          NEONCTL_PSQL_FALLBACK=1 neon psql "${VERIFY_BRANCH_ID}"             --project-id "${NEON_PROJECT_ID}"             --database-name neondb             --role-name neondb_owner             -- -q -v ON_ERROR_STOP=1 <<SQL
          SET ROLE authenticated;
          SET request.jwt.claims = '{"sub":"${A}","role":"authenticated"}';
          INSERT INTO caleida_profile.profiles (username, display_name, visibility)
          VALUES ('neon_lifecycle_a', 'Neon Lifecycle A', 'public');

          SET request.jwt.claims = '{"sub":"${B}","role":"authenticated"}';
          INSERT INTO caleida_profile.profiles (username, display_name, visibility)
          VALUES ('neon_lifecycle_b', 'Neon Lifecycle B', 'public');

          SET request.jwt.claims = '{"sub":"${C}","role":"authenticated"}';
          INSERT INTO caleida_profile.profiles (username, display_name, visibility)
          VALUES ('neon_lifecycle_c', 'Neon Lifecycle C', 'public');

          SET request.jwt.claims = '{"sub":"${A}","role":"authenticated"}';
          INSERT INTO caleida_profile.profile_blocks (blocked_auth_user_id, blocked_username)
          VALUES ('${C}', 'neon_lifecycle_c');
          RESET ROLE;
          RESET request.jwt.claims;
          SQL

          test "$(query "SET ROLE authenticated; SET request.jwt.claims='{\"sub\":\"${B}\",\"role\":\"authenticated\"}'; SELECT count(*) FROM caleida_profile.profiles WHERE auth_user_id='${A}';")" = "1"
          test "$(query "SET ROLE anonymous; RESET request.jwt.claims; SELECT count(username) FROM caleida_profile.profiles WHERE username='neon_lifecycle_a';")" = "1"

          query "INSERT INTO caleida_account.account_lifecycle (auth_user_id,status,deactivated_at) VALUES ('${A}','deactivated',CURRENT_TIMESTAMP);" >/dev/null

          test "$(query "SELECT caleida_account.is_account_active('${A}')::text || '|' || caleida_account.is_account_active('${B}')::text;")" = "false|true"
          test "$(query "SET ROLE authenticated; SET request.jwt.claims='{\"sub\":\"${A}\",\"role\":\"authenticated\"}'; SELECT count(*) FROM caleida_profile.profiles WHERE auth_user_id='${A}';")" = "1"
          test "$(query "SET ROLE authenticated; SET request.jwt.claims='{\"sub\":\"${B}\",\"role\":\"authenticated\"}'; SELECT count(*) FROM caleida_profile.profiles WHERE auth_user_id='${A}';")" = "0"
          test "$(query "SET ROLE anonymous; RESET request.jwt.claims; SELECT count(username) FROM caleida_profile.profiles WHERE username='neon_lifecycle_a';")" = "0"

          update_count="$(query "SET ROLE authenticated; SET request.jwt.claims='{\"sub\":\"${A}\",\"role\":\"authenticated\"}'; WITH changed AS (UPDATE caleida_profile.profiles SET display_name='must not change' WHERE auth_user_id='${A}' RETURNING 1) SELECT count(*) FROM changed;")"
          test "${update_count}" = "0"

          block_count="$(query "SET ROLE authenticated; SET request.jwt.claims='{\"sub\":\"${A}\",\"role\":\"authenticated\"}'; SELECT count(*) FROM caleida_profile.profile_blocks;")"
          test "${block_count}" = "0"

          block_delete_count="$(query "SET ROLE authenticated; SET request.jwt.claims='{\"sub\":\"${A}\",\"role\":\"authenticated\"}'; WITH removed AS (DELETE FROM caleida_profile.profile_blocks WHERE blocked_auth_user_id='${C}' RETURNING 1) SELECT count(*) FROM removed;")"
          test "${block_delete_count}" = "0"

          preserved="$(query "RESET ROLE; RESET request.jwt.claims; SELECT (SELECT count(*) FROM caleida_profile.profiles WHERE auth_user_id='${A}') || '|' || (SELECT count(*) FROM caleida_profile.profile_blocks WHERE blocker_auth_user_id='${A}' AND blocked_auth_user_id='${C}');")"
          test "${preserved}" = "1|1"

          if query "SET ROLE authenticated; SET request.jwt.claims='{\"sub\":\"${A}\",\"role\":\"authenticated\"}'; SELECT * FROM caleida_account.account_lifecycle;" >/dev/null 2>&1; then
            echo 'authenticated unexpectedly read account_lifecycle'
            exit 1
          fi

          query "UPDATE caleida_account.account_lifecycle SET status='active', reactivated_at=CURRENT_TIMESTAMP, updated_at=CURRENT_TIMESTAMP WHERE auth_user_id='${A}';" >/dev/null

          test "$(query "SET ROLE authenticated; SET request.jwt.claims='{\"sub\":\"${B}\",\"role\":\"authenticated\"}'; SELECT count(*) FROM caleida_profile.profiles WHERE auth_user_id='${A}';")" = "1"
          test "$(query "SET ROLE anonymous; RESET request.jwt.claims; SELECT count(username) FROM caleida_profile.profiles WHERE username='neon_lifecycle_a';")" = "1"
          test "$(query "SET ROLE authenticated; SET request.jwt.claims='{\"sub\":\"${A}\",\"role\":\"authenticated\"}'; WITH changed AS (UPDATE caleida_profile.profiles SET display_name='Neon Lifecycle A Restored' WHERE auth_user_id='${A}' RETURNING 1) SELECT count(*) FROM changed;")" = "1"
          test "$(query "SET ROLE authenticated; SET request.jwt.claims='{\"sub\":\"${A}\",\"role\":\"authenticated\"}'; SELECT count(*) FROM caleida_profile.profile_blocks;")" = "1"

          echo 'CALEIDA_NEON_LIFECYCLE_MATRIX_PASS true'
          echo 'CALEIDA_NEON_SYNTHETIC_DATA_ISOLATED true'

      - name: Final readback
        shell: bash
        run: |
          set -euo pipefail
          echo "CALEIDA_NEON_VERIFICATION_BRANCH ${VERIFY_BRANCH_ID}"
          echo 'CALEIDA_NEON_GATE_PASS true'
