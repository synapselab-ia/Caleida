name: US-AUTH-001 Lockfile Bootstrap

on:
  push:
    branches:
      - feat/us-auth-001-neon-auth-foundation
    paths:
      - package.json
      - .github/workflows/us-auth-001-lockfile.yml

permissions:
  contents: read

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/us-auth-001-neon-auth-foundation
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Verify runtime contract
        shell: bash
        run: |
          test "$(node --version)" = "v24.20.0"
          test "$(npm --version)" = "11.19.0"
      - name: Regenerate lockfile only
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify lockfile resolves the pinned SDK
        shell: bash
        run: |
          node -e "const l=require('./package-lock.json'); if(l.packages['node_modules/@neondatabase/auth']?.version !== '0.5.0-beta') process.exit(1)"
      - name: Upload generated lockfile
        uses: actions/upload-artifact@v6
        with:
          name: us-auth-001-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
