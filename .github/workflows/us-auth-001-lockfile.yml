name: US-AUTH-001 Lockfile Bootstrap

on:
  push:
    branches:
      - feat/us-auth-001-neon-auth-foundation
    paths:
      - package.json
      - .github/workflows/us-auth-001-lockfile.yml

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/us-auth-001-neon-auth-foundation
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Verify runtime contract
        shell: bash
        run: |
          test "$(node --version)" = "v24.20.0"
          test "$(npm --version)" = "11.19.0"
      - name: Regenerate lockfile only
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile when changed
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(auth): atualizar package-lock"
          git push origin HEAD:feat/us-auth-001-neon-auth-foundation
